<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genshin Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&display=swap">
<link rel="preconnect" href="https://gi.yatta.moe">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="cielo" aria-hidden="true"></div>
<header class="barra">
  <a class="marca" href="#" aria-label="Genshin Team Builder, inicio"><span class="marca-estrella" aria-hidden="true">✦</span><span>Team Builder</span></a>
  <nav aria-label="Secciones">
    <button data-t="recomendar">Equipos</button>
    <button data-t="personajes">Mis personajes</button>
    <button data-t="armas">Mis armas</button>
    <button data-t="datos">Importar</button>
  </nav>
</header>
<section class="heroe" id="heroe" aria-live="polite"></section>
<main>
  <div class="herramientas" id="filtros"></div>
  <div id="contenido"></div>
  <p class="pie">Imágenes oficiales de Genshin Impact (HoYoverse), cargadas desde Yatta. <span id="aviso-cat"></span></p>
</main>
<dialog id="ficha" aria-label="Ficha del personaje"></dialog>
<script src="js/good.js"></script>
<script src="js/equipos.js"></script>
<script src="js/datos.js"></script>
<script src="js/recomendador.js"></script>
<script src="js/progreso.js"></script>
<script src="js/app.js"></script>
</body>
</html>
